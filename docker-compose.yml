version: "3.9"

services:
  listify:
    build: .
    container_name: listify
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - NUXT_LISTIFY_DATA_DIR=/app/data
    volumes:
      # En v1, ce volume était monté sur /app/data/lists : les .md de prod sont
      # donc à la racine du volume, là où la migration SQLite va les lire.
      - listify_data:/app/data

    networks:
      - default

networks:
  default:
    name: arr-network
    external: true

volumes:
  listify_data:
